hydro_gap_scenarios:
  status: user_assumptions
  storage_shift_percentages: [0, 5, 10, 20, 30]
  storage_shift_base_percent: 10
  storage_shift_basis:
    status: user_estimate_not_measured
    note: >-
      The 10 percent base is the user's rough estimate, not a measured Nepal
      figure. The user's calculation uses a roughly 20 percent PRoR share and
      concentrated evening output; lower PRoR shares or limited pondage imply
      about 8-10 percent. User-reported PRoR estimates differ substantially.
      20 and 30 percent are optimistic sensitivities; source claims are
      unverified.
    method: >-
      Move this percentage of each day's total hydro energy from the other
      19 hourly periods proportionally, then add it evenly to 18:00-22:00.
      Preserve daily and monthly hydro energy.
  hydro_share_sensitivity_percentage_points: 10
  hydro_share_bounds_percent: [0, 100]
  nea_import_expectation:
    status: user_reported_unverified
    comparison_months: [Magh, Falgun]
    peak_hours_mw: [800, 900]
    around_the_clock_mw: [450, 500]
    note: >-
      User-reported NEA import expectation for roughly mid-January to
      mid-March; verify against a primary NEA source before treating as fact.
